<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hive Collapse - Rust-style TS ECS + p5.js</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0d12;
        color: #e2e8f0;
        font-family: monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      canvas {
        border: 2px solid #2d3748;
        border-radius: 4px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
