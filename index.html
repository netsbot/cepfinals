<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hive Collapse - Top-Down ECS Roguelike</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #05070c;
        color: #e2e8f0;
        font-family: monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
        position: relative;
      }
      #game-container {
        display: flex;
        flex-direction: row;
        gap: 20px;
        align-items: flex-start;
      }
      canvas {
        border: 2px solid #1e293b;
        border-radius: 6px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
      }
      /* External HUD Sidebar Styling */
      #hud-sidebar {
        width: 280px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .hud-card {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 14px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }
      .hud-card h3 {
        font-size: 13px;
        color: #06b6d4;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid #1e293b;
        padding-bottom: 6px;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .stat-label {
        color: #94a3b8;
      }
      .stat-value {
        font-weight: bold;
        color: #f8fafc;
      }
      .progress-bar-bg {
        width: 100%;
        height: 8px;
        background: #1e293b;
        border-radius: 4px;
        overflow: hidden;
        margin-top: 2px;
        margin-bottom: 8px;
      }
      .progress-bar-fill {
        height: 100%;
        background: #22c55e;
        width: 100%;
        transition: width 0.15s ease;
      }
      .btn {
        background: #4338ca;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        padding: 10px 16px;
        font-family: monospace;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s ease;
        width: 100%;
        text-align: center;
      }
      .btn:hover {
        background: #4f46e5;
      }
      /* Level Up Modal Styling */
      .modal-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(5, 7, 12, 0.88);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
      }
      .modal-card {
        background: #0f172a;
        border: 2px solid #06b6d4;
        border-radius: 12px;
        padding: 28px;
        width: 620px;
        text-align: center;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.8);
      }
      .modal-card h2 {
        font-size: 32px;
        color: #06b6d4;
        letter-spacing: 2px;
        margin-bottom: 4px;
      }
      .modal-subtitle {
        font-size: 14px;
        color: #94a3b8;
        margin-bottom: 24px;
      }
      .perks-grid {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .perk-option {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 16px;
        text-align: left;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .perk-option:hover {
        border-color: #06b6d4;
        background: #26334d;
        transform: translateY(-2px);
      }
      .perk-title {
        font-size: 16px;
        font-weight: bold;
        color: #facc15;
        margin-bottom: 4px;
      }
      .perk-desc {
        font-size: 13px;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-container">
        <div id="canvas-container"></div>
        <div id="hud-sidebar">
          <!-- Player Status Card -->
          <div class="hud-card">
            <h3>Player Status</h3>
            <div class="stat-row">
              <span class="stat-label">Level</span>
              <span class="stat-value" id="hud-level" style="color: #06b6d4">1</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">XP</span>
              <span class="stat-value" id="hud-xp">0/100</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="hud-xp-bar" style="background: #06b6d4; width: 0%"></div>
            </div>
            <div class="stat-row">
              <span class="stat-label">Health</span>
              <span class="stat-value" id="hud-hp">100/100</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="hud-hp-bar"></div>
            </div>
            <div class="stat-row">
              <span class="stat-label">Ammo</span>
              <span class="stat-value" id="hud-ammo" style="color: #facc15">5/5</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Lifesteal</span>
              <span class="stat-value" id="hud-lifesteal" style="color: #34d399">20%</span>
            </div>
          </div>

          <!-- Wave Info Card -->
          <div class="hud-card">
            <h3>Wave Info</h3>
            <div class="stat-row">
              <span class="stat-label">Current Wave</span>
              <span class="stat-value" id="hud-wave" style="color: #06b6d4">1</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Enemy Type</span>
              <span class="stat-value" id="hud-wave-type" style="color: #f43f5e">SLASHERS</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Enemies Remaining</span>
              <span class="stat-value" id="hud-enemies" style="color: #f43f5e">12</span>
            </div>
          </div>

          <!-- DNA Evolution Dashboard -->
          <div class="hud-card">
            <h3>DNA Evolution</h3>
            <div class="stat-row">
              <span class="stat-label">Top Speed</span>
              <span class="stat-value" id="hud-top-speed">0.00</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Top Max HP</span>
              <span class="stat-value" id="hud-top-hp">0</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Top Aggression</span>
              <span class="stat-value" id="hud-top-aggression">0%</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Top Heal Rate</span>
              <span class="stat-value" id="hud-top-heal">0.00</span>
            </div>
          </div>

          <!-- Controls & Help Button -->
          <div class="hud-card">
            <button class="btn" id="btn-help">Guide [H]</button>
          </div>
        </div>
      </div>

      <!-- Level Up Perks Choice Modal Overlay -->
      <div id="level-up-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
          <h2>LEVEL UP!</h2>
          <p class="modal-subtitle">CHOOSE A PERK REWARD</p>
          <div id="perks-container" class="perks-grid"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
